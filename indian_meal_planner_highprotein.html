        * {

            padding: 0;

        }

        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .week-info {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .auto-update-banner {
            background: #27ae60;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1em;
            display: none;
        }

        .auto-update-banner.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .print-btn { background: #27ae60; color: white; }
        .regenerate-btn { background: #3498db; color: white; }
        .share-btn { background: #e74c3c; color: white; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.6em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .week-planner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .day-card {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
        }

        .day-card h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 1.2em;
        }

        .daily-nutrition {
            background: #e8f4f8;
            border: 1px solid #3498db;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .nutrition-stat {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .nutrition-stat.protein {
            color: #27ae60;
            font-weight: bold;
        }

        .nutrition-stat.calories {
            color: #e74c3c;
            font-weight: bold;
        }

        .nutrition-stat.warning {
            color: #e67e22;
            font-weight: bold;
        }

        .meal-slot {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .meal-slot:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .meal-label {
            font-weight: bold;
            color: #555;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .meal-name {
            color: #764ba2;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meal-name:hover {
            background: #ffe8cc;
            text-decoration: underline;
        }

        .meal-nutrition {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
            display: flex;
            gap: 8px;
        }

        .protein-badge {
            background: #27ae60;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .cuisine-badge {
            font-size: 0.75em;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 5px;
        }

        .cuisine-indian { background: #ffa500; color: white; }
        .cuisine-italian { background: #dc143c; color: white; }
        .cuisine-mediterranean { background: #4169e1; color: white; }
        .cuisine-asian { background: #ff1493; color: white; }
        .cuisine-western { background: #32cd32; color: white; }

        .grocery-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            grid-column: 1 / -1;
        }

        .grocery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .grocery-category {
            background: #f8f9fa;

            padding: 15px;
            border-radius: 6px;
        }

        .grocery-category h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

            font-size: 0.95em;
        }

        .grocery-item:last-child {
            border-bottom: none;
        }

            margin-right: 8px;
        }

            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

            color: black;
        }

            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recipe-option:hover {
            border-color: #667eea;
            background: #eff2ff;
        }

        .recipe-option h4 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .recipe-option p {
            font-size: 0.9em;
            color: #666;
            margin: 3px 0;
        }

        .recipe-nutrition {
            display: flex;
            gap: 10px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .nutrition-badge {
            background: #e8f4f8;
            padding: 3px 8px;
            border-radius: 3px;
            color: #333;
        }

            header h1 {
                font-size: 1.8em;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        @media print {
            body {
                background: white;
            }

            .controls {
                display: none;
            }

            .card {
                page-break-inside: avoid;
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }

        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        let currentMealPlan = {};
        let weekNumber = 1;

        function getRecipeById(mealType, recipeName) {
            return recipes[mealType].find(r => r.name === recipeName);
        }

        function getCuisineColor(cuisine) {
            const colors = {
                'Indian': 'cuisine-indian',
                'Italian': 'cuisine-italian',
                'Mediterranean': 'cuisine-mediterranean',
                'Asian': 'cuisine-asian',
                'Western': 'cuisine-western'
            };
            return colors[cuisine] || 'cuisine-indian';
        }

        function calculateDailyNutrition(day) {
            const meals = currentMealPlan[day];
            if (!meals) return { protein: 0, carbs: 0, fat: 0, calories: 0 };

            let totals = { protein: 0, carbs: 0, fat: 0, calories: 0 };
            ['breakfast', 'lunch', 'dinner'].forEach(mealType => {
                const recipe = getRecipeById(mealType, meals[mealType]);
                if (recipe) {
                    totals.protein += recipe.protein;
                    totals.carbs += recipe.carbs;
                    totals.fat += recipe.fat;
                    totals.calories += recipe.calories;
                }
            });
            return totals;
        }

        function checkAndAutoGenerate() {
            const now = new Date();
            const saved = localStorage.getItem('mealPlanData');

            if (saved) {
                const data = JSON.parse(saved);
                const lastUpdate = new Date(data.lastUpdated);
                const daysElapsed = Math.floor((now - lastUpdate) / (1000 * 60 * 60 * 24));

                if (daysElapsed >= 7) {
                    generateNewWeek();
                    const banner = document.getElementById('autoBanner');
                    banner.classList.add('show');
                    setTimeout(() => banner.classList.remove('show'), 5000);
                }

                const daysUntilUpdate = 7 - daysElapsed;
                if (daysUntilUpdate > 0) {
                    const nextDate = new Date(lastUpdate);
                    nextDate.setDate(nextDate.getDate() + 7);
                    const options = { month: 'short', day: 'numeric' };
                    const nextDateStr = nextDate.toLocaleDateString('en-US', options);
                    document.getElementById('nextUpdate').textContent = `⏰ Next auto-update: ${nextDateStr} (${daysUntilUpdate} days)`;
                }
            }
        }

        function ensureMinimumIndian(week) {
            let indianCount = 0;
            const mealPlan = {};
            const allMealTypes = ['breakfast', 'lunch', 'dinner'];

            days.forEach(day => {
                mealPlan[day] = {};
                allMealTypes.forEach(mealType => {
                    const recipeIndex = Math.floor(Math.random() * recipes[mealType].length);
                    mealPlan[day][mealType] = recipes[mealType][recipeIndex].name;
                    if (recipes[mealType][recipeIndex].cuisine === 'Indian') {
                        indianCount++;
                    }
                });
            });

            // Ensure at least 50% Indian meals (10-11 out of 21 meals)
            while (indianCount < 11) {
                const dayIndex = Math.floor(Math.random() * 7);
                const day = days[dayIndex];
                const mealType = allMealTypes[Math.floor(Math.random() * 3)];

                const currentRecipe = getRecipeById(mealType, mealPlan[day][mealType]);
                if (currentRecipe.cuisine !== 'Indian') {
                    const indianRecipes = recipes[mealType].filter(r => r.cuisine === 'Indian');
                    const newRecipe = indianRecipes[Math.floor(Math.random() * indianRecipes.length)];
                    mealPlan[day][mealType] = newRecipe.name;
                    indianCount++;
                }
            }

            return mealPlan;
        }

        function generateNewWeek() {
            currentMealPlan = ensureMinimumIndian();
            weekNumber = (weekNumber % 4) + 1;

            localStorage.setItem('mealPlanData', JSON.stringify({
                currentMealPlan: currentMealPlan,
                weekNumber: weekNumber,
                lastUpdated: new Date().toISOString()
            }));

            renderMealPlan();
        }

        function renderMealPlan() {
            document.getElementById('weekInfo').textContent = `Week ${weekNumber}`;
            const container = document.getElementById('mealPlanContainer');
            container.innerHTML = '';

            days.forEach(day => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';

                const nutrition = calculateDailyNutrition(day);
                const proteinStatus = nutrition.protein >= 80 ? 'protein' : 'warning';
                const caloriesStatus = nutrition.calories <= 2000 ? 'calories' : 'warning';

                dayCard.innerHTML = `
                    <h3>${day}</h3>
                    <div class="daily-nutrition">
                        <div class="nutrition-stat ${proteinStatus}">
                            <span>💪 Protein:</span> <strong>${nutrition.protein}g ${nutrition.protein >= 80 ? '✅' : '❌'}</strong>
                        </div>
                        <div class="nutrition-stat">
                            <span>🔥 Calories:</span> <strong>${nutrition.calories} kcal</strong>
                        </div>
                        <div class="nutrition-stat">
                            <span>🥗 Carbs:</span> <strong>${nutrition.carbs}g</strong>
                        </div>
                        <div class="nutrition-stat">
                            <span>🧈 Fat:</span> <strong>${nutrition.fat}g</strong>
                        </div>
                    </div>
                `;

                ['breakfast', 'lunch', 'dinner'].forEach(mealType => {
                    const recipeName = currentMealPlan[day][mealType];
                    const recipe = getRecipeById(mealType, recipeName);

                    const mealDiv = document.createElement('div');
                    mealDiv.className = 'meal-slot';

                    const mealLabel = document.createElement('div');
                    mealLabel.className = 'meal-label';
                    mealLabel.textContent = mealType.charAt(0).toUpperCase() + mealType.slice(1);

                    const mealNameDiv = document.createElement('div');
                    mealNameDiv.className = 'meal-name';
                    mealNameDiv.onclick = () => openMealModal(day, mealType);
                    mealNameDiv.innerHTML = `
                        <span>${recipeName}</span>
                        <span class="cuisine-badge ${getCuisineColor(recipe.cuisine)}">${recipe.cuisine}</span>
                    `;

                    const nutritionDiv = document.createElement('div');
                    nutritionDiv.className = 'meal-nutrition';
                    nutritionDiv.innerHTML = `
                        <span class="protein-badge">${recipe.protein}g P</span>
                        <span class="nutrition-badge">${recipe.calories} cal</span>
                    `;

                    mealDiv.appendChild(mealLabel);
                    mealDiv.appendChild(mealNameDiv);
                    mealDiv.appendChild(nutritionDiv);
                    dayCard.appendChild(mealDiv);
                });

                container.appendChild(dayCard);
            });

            generateGroceryList();
        }

        function generateGroceryList() {
            const groceryMap = {};

            days.forEach(day => {
                ['breakfast', 'lunch', 'dinner'].forEach(mealType => {
                    const recipe = getRecipeById(mealType, currentMealPlan[day][mealType]);

                    if (recipe && recipe.ingredients) {
                        const items = recipe.ingredients.split(',');
                        items.forEach(item => {
                            const trimmed = item.trim();
                            if (trimmed) {
                                if (!groceryMap[trimmed]) {
                                    groceryMap[trimmed] = 0;
                                }
                                groceryMap[trimmed]++;
                            }
                        });
                    }
                });
            });

            const categories = {
                'Dairy & Protein': [],
                'Vegetables': [],
                'Pantry & Spices': [],
                'Other': []
            };

            Object.keys(groceryMap).forEach(item => {
                if (item.includes('paneer') || item.includes('cheese') || item.includes('yogurt') ||
                    item.includes('tofu') || item.includes('lentils') || item.includes('beans') ||
                    item.includes('chickpea') || item.includes('egg')) {
                    categories['Dairy & Protein'].push(item);
                } else if (item.includes('tomato') || item.includes('onion') || item.includes('carrot') ||
                          item.includes('pepper') || item.includes('spinach') || item.includes('mushroom')) {
                    categories['Vegetables'].push(item);
                } else if (item.includes('oil') || item.includes('spice') || item.includes('salt') ||
                          item.includes('rice') || item.includes('bread') || item.includes('flour')) {
                    categories['Pantry & Spices'].push(item);
                } else {
                    categories['Other'].push(item);
                }
            });

            const groceryContainer = document.getElementById('groceryContainer');
            groceryContainer.innerHTML = '';

            Object.keys(categories).forEach(category => {
                if (categories[category].length > 0) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'grocery-category';
                    categoryDiv.innerHTML = `<h3>${category}</h3>`;

                    categories[category].forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'grocery-item';
                        itemDiv.innerHTML = `<input type="checkbox"> ${item}`;
                        categoryDiv.appendChild(itemDiv);
                    });

                    groceryContainer.appendChild(categoryDiv);
                }
            });
        }

        function openMealModal(day, mealType) {
            const modal = document.getElementById('mealModal');
            const recipesList = document.getElementById('recipesList');
            const currentRecipe = currentMealPlan[day][mealType];

            recipesList.innerHTML = '';
            recipes[mealType].forEach(recipe => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'recipe-option';
                optionDiv.innerHTML = `
                    <h4>${recipe.name}</h4>
                    <p>${recipe.cuisine} Cuisine | ⏱️ ${recipe.prepTime}</p>
                    <div class="recipe-nutrition">
                        <span class="nutrition-badge">🍗 ${recipe.protein}g Protein</span>
                        <span class="nutrition-badge">🔥 ${recipe.calories} cal</span>
                        <span class="nutrition-badge">🥗 ${recipe.carbs}g C</span>
                    </div>
                `;
                optionDiv.onclick = () => {
                    currentMealPlan[day][mealType] = recipe.name;
                    localStorage.setItem('mealPlanData', JSON.stringify({
                        currentMealPlan: currentMealPlan,
                        weekNumber: weekNumber,
                        lastUpdated: localStorage.getItem('mealPlanData') ?
                            JSON.parse(localStorage.getItem('mealPlanData')).lastUpdated :
                            new Date().toISOString()
                    }));
                    renderMealPlan();
                    closeModal();
                };
                recipesList.appendChild(optionDiv);
            });

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('mealModal').classList.remove('show');
        }

        function shareWithFamily() {
            const whatsappText = `🍛 Family High-Protein Vegetarian Meal Planner 🍛\n\nHi everyone!\n\nHere's our meal plan for Week ${weekNumber}:\n\n`;
            let summary = '';

            days.forEach(day => {
                const nutrition = calculateDailyNutrition(day);
                summary += `\n${day.toUpperCase()}\n`;
                summary += `Protein: ${nutrition.protein}g | Calories: ${nutrition.calories}\n`;
                summary += `B: ${currentMealPlan[day].breakfast}\n`;
                summary += `L: ${currentMealPlan[day].lunch}\n`;
                summary += `D: ${currentMealPlan[day].dinner}\n`;
            });

            const encodedText = encodeURIComponent(whatsappText + summary + '\n\n✅ Minimum 80g protein per day!\n50% Indian | 50% International\n📹 Click meals to watch recipes!');
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
        }

        // Initialize
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('mealPlanData');
            if (saved) {
                const data = JSON.parse(saved);
                currentMealPlan = data.currentMealPlan;
                weekNumber = data.weekNumber;
                checkAndAutoGenerate();
            } else {
                generateNewWeek();
            }
            renderMealPlan();
        });
    </script>
